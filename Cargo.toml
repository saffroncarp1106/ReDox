[package]
name = "redox"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
description = "A native Rust desktop workspace for local coding assistants"
publish = false

[[bin]]
name = "redox"
path = "src/main.rs"

[[bin]]
name = "presence-test"
path = "src/presence.rs"

[dependencies]
eframe = { version = "=0.33.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
egui_commonmark = { version = "=0.22.0", default-features = false, features = ["pulldown_cmark", "load-images", "embedded_image"] }
egui_extras = { version = "=0.33.3", default-features = false, features = ["file", "image", "gif", "webp", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
open = "5"
dirs = "6"
arboard = "=3.7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
latex-rust = { version = "=2.1.1", features = ["png"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
discord-rich-presence = "=1.1.0"
cap-std = "4.0.3"
tempfile = "3.27.0"

# Enable the Linux window backends directly. eframe's wayland/x11 feature
# forwarding also pulls its unused optional WGPU dependencies into Cargo.lock.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
egui-winit = { version = "0.33", default-features = false, features = ["wayland", "x11"] }
glutin-winit = { version = "0.5", default-features = false, features = ["glx", "wayland"] }
winit = { version = "0.30.12", default-features = false, features = ["wayland-csd-adwaita", "wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
raw-window-handle = "0.6"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
winrt-toast-reborn = "0.3.8"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "ollama-bench-runner"
path = "tests/perf/ollama_bench_runner.rs"
